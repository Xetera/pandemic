apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandemic
spec:
  selector:
    matchLabels:
      app: pandemic
  template:
    metadata:
      labels:
        app: pandemic
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: pandemic
          image: ghcr.io/xetera/pandemic:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 20
